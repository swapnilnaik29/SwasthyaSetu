services:
  - type: web
    name: swasthyasetu-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///swasthyasetu.db
      - key: GNANI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

